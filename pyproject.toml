[project]
name = "ai-assistant"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.9.2,<0.10"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
