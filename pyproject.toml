[project]
name = "ai-assistant"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.9.2,<0.10"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
]

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["ai_assistant"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
